name: FitnessOSCompanion
options:
  bundleIdPrefix: com.sakethdonepudi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: ""

targets:
  FitnessOSCompanion:
    type: application
    platform: iOS
    sources:
      - path: FitnessOSCompanion
        excludes:
          - Info.plist
          - FitnessOSCompanion.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakethdonepudi.fitnessos.bridge
        PRODUCT_NAME: FitnessOSCompanion
        INFOPLIST_FILE: FitnessOSCompanion/Info.plist
        CODE_SIGN_ENTITLEMENTS: FitnessOSCompanion/FitnessOSCompanion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
schemes:
  FitnessOSCompanion:
    build:
      targets:
        FitnessOSCompanion: all
    run:
      config: Debug
    archive:
      config: Release
